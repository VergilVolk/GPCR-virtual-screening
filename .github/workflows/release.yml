name: Build release package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build archive
        run: |
          mkdir pacer-m4-open-source
          cp -r submission docs LICENSE CITATION.cff THIRD_PARTY_NOTICES.md pacer-m4-open-source/
          zip -r pacer-m4-open-source-${GITHUB_REF_NAME}.zip pacer-m4-open-source
          sha256sum pacer-m4-open-source-${GITHUB_REF_NAME}.zip > pacer-m4-open-source-${GITHUB_REF_NAME}.zip.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pacer-m4-open-source-${GITHUB_REF_NAME}.zip pacer-m4-open-source-${GITHUB_REF_NAME}.zip.sha256 --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
