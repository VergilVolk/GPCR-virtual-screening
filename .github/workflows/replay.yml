name: Frozen replay

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: submission
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: submission/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Replay frozen pipeline
        run: python predict.py
      - name: Verify hashes and final table
        run: python verify_submission.py
