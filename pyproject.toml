[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pacer-m4"
version = "0.1.0"
description = "Auditable orchestration tools for the PACER-M4 computational screening workflow"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "PACER-M4 team"}]

[project.scripts]
pacer-m4 = "pacer_m4.cli:main"

[project.optional-dependencies]
core = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "rdkit>=2023.9"
]
api = [
  "fastapi>=0.110,<0.111",
  "uvicorn>=0.27,<0.28"
]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["pacer_m4*"]

[tool.pytest.ini_options]
filterwarnings = [
  "ignore:Using .*starlette.testclient.*"
]
